[project]
name = "epshtein-discord-bot"
version = "0.1.0"
description = "Discord onboarding bot that assigns game roles to new members."
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
